<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>互传 - 简易传输站</title>
    <link rel="stylesheet" href="./all.min.css">
    <link href="./css2.css" rel="stylesheet">
    <script>
        // ai coding: 页面渲染前应用已保存的皮肤，默认暗色，避免切换时闪烁 2026/09/18: 20:56
        (function () {
            var saved = localStorage.getItem('lct-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <style>
/* ai coding: 引入黑白双皮肤变量体系（默认暗色），并保留 Liquid Glass 视觉 2026/09/18: 20:56 */
        :root {
            --btn-height: 40px;
            --radius-lg: 28px;
            --radius-md: 20px;
            --radius-sm: 14px;
            --glass-blur: blur(28px) saturate(180%);
        }

        /* 暗色皮肤（默认） */
        :root,
        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #07080c;
            --ink-strong: #f2f3f7;
            --ink-soft: #a3a6b3;
            --accent: #ff5c61;
            --accent-soft: rgba(255, 92, 97, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-strong: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            --surface: rgba(255, 255, 255, 0.05);
            --surface-weak: rgba(255, 255, 255, 0.035);
            --surface-strong: rgba(255, 255, 255, 0.12);
            --hairline: rgba(255, 255, 255, 0.16);
            --hairline-strong: rgba(255, 255, 255, 0.3);
            --inset-highlight: rgba(255, 255, 255, 0.1);
            --rim: linear-gradient(140deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.06) 40%, rgba(255, 255, 255, 0) 60%, rgba(255, 255, 255, 0.28));
            --btn-bg: rgba(255, 255, 255, 0.08);
            --btn-bg-hover: rgba(255, 255, 255, 0.16);
            --toast-bg: rgba(250, 250, 252, 0.16);
            --toast-fg: #ffffff;
            --drop-bg: rgba(6, 7, 11, 0.55);
            --qrcode-bg: #ffffff;
            --aurora:
                radial-gradient(38% 38% at 18% 22%, rgba(255, 90, 95, 0.35), transparent 70%),
                radial-gradient(34% 34% at 82% 16%, rgba(64, 110, 255, 0.35), transparent 70%),
                radial-gradient(42% 42% at 76% 82%, rgba(150, 90, 255, 0.32), transparent 70%),
                radial-gradient(40% 40% at 22% 84%, rgba(40, 200, 170, 0.28), transparent 70%);
        }

        /* 亮色皮肤 */
        html[data-theme="light"] {
            color-scheme: light;
            --bg: #eef1f8;
            --ink-strong: #1c1c1e;
            --ink-soft: #4a4a4f;
            --accent: #e5484d;
            --accent-soft: rgba(229, 72, 77, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-strong: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-highlight: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 20px 50px rgba(38, 50, 120, 0.16);
            --surface: rgba(255, 255, 255, 0.45);
            --surface-weak: rgba(255, 255, 255, 0.34);
            --surface-strong: rgba(255, 255, 255, 0.72);
            --hairline: rgba(28, 28, 30, 0.18);
            --hairline-strong: rgba(28, 28, 30, 0.3);
            --inset-highlight: rgba(255, 255, 255, 0.85);
            --rim: linear-gradient(140deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.15) 35%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, 0.6));
            --btn-bg: rgba(255, 255, 255, 0.6);
            --btn-bg-hover: rgba(255, 255, 255, 0.88);
            --toast-bg: rgba(28, 28, 30, 0.6);
            --toast-fg: #ffffff;
            --drop-bg: rgba(255, 255, 255, 0.45);
            --qrcode-bg: #ffffff;
            --aurora:
                radial-gradient(38% 38% at 18% 22%, rgba(255, 138, 128, 0.55), transparent 70%),
                radial-gradient(34% 34% at 82% 16%, rgba(112, 182, 255, 0.55), transparent 70%),
                radial-gradient(42% 42% at 76% 82%, rgba(186, 140, 255, 0.5), transparent 70%),
                radial-gradient(40% 40% at 22% 84%, rgba(110, 231, 183, 0.5), transparent 70%);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            color: var(--ink-strong);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background-color: var(--bg);
        }

        body {
            position: relative;
            padding: 44px 20px 60px;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 动态彩色光斑：为玻璃材质提供可被折射的背景光源 */
        body::before {
            content: "";
            position: fixed;
            inset: -25%;
            z-index: -1;
            background: var(--aurora);
            filter: blur(46px);
            will-change: transform;
            animation: aurora 24s ease-in-out infinite alternate;
            transition: background 0.3s ease;
        }

        @keyframes aurora {
            0% { transform: translate3d(-2%, -1%, 0) scale(1); }
            50% { transform: translate3d(2%, 2%, 0) scale(1.06); }
            100% { transform: translate3d(-1%, 3%, 0) scale(1.02); }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
        }

        /* ai coding: 右上角黑白皮肤切换按钮（扁平样式，与整页按钮一致） 2026/09/18: 20:56 */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 3000;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--ink-strong);
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:hover {
            background: var(--btn-bg-hover);
            color: var(--accent);
            border-color: var(--accent-soft);
        }

        /* 主玻璃面板 */
        .block-border {
            position: relative;
            padding: 30px;
            border-radius: var(--radius-lg);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
        }

        /* 玻璃边缘的渐变高光描边 */
        .block-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: var(--rim);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            position: relative;
        }

        /* 顶部进度条 */
        .progress-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            pointer-events: none;
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background-color: transparent;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            border-radius: 0 999px 999px 0;
            background: linear-gradient(90deg, #ff8f6b, var(--accent), #b06bff);
            box-shadow: 0 0 16px var(--accent-soft);
            transition: width 0.3s ease;
        }

        #upload-speed {
            color: var(--ink-soft);
            font-weight: 600;
        }

        /* ai coding: 按钮为纯扁平样式，保留黑白双皮肤配色 2026/09/18: 20:56 */
        .btn {
            height: var(--btn-height);
            padding: 0 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-strong);
            background: var(--btn-bg);
            border: 1px solid var(--hairline);
            border-radius: 999px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: var(--btn-bg-hover);
            color: var(--accent);
            border-color: var(--accent-soft);
        }

        .btn:active {
            background: var(--btn-bg-hover);
        }

        .btn-red {
            color: var(--accent);
        }

        .btn-red:hover {
            background: rgba(229, 72, 77, 0.9);
            color: #fff;
            border-color: rgba(229, 72, 77, 0.9);
        }

        .section-card {
            margin-bottom: 30px;
        }

        h3 {
            position: relative;
            margin: 0 0 18px;
            padding-left: 14px;
            font-size: 1.15rem;
            font-weight: 700;
        }

        h3::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 5px;
            height: 20px;
            transform: translateY(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, #ff9a76, var(--accent));
            box-shadow: 0 0 10px var(--accent-soft);
        }

        /* ai coding: 文字传送区改为左右布局——输入框在左，两个按钮在右侧纵向排列 2026/09/18: 20:49 */
        .text-tool {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 12px;
        }

        .text-tool > div {
            flex: 0 0 auto;
            flex-direction: column;
            justify-content: center;
        }

        .text-tool > div .btn {
            flex: 0 0 auto;
            height: var(--btn-height);
            min-height: 0;
            padding: 0 18px;
        }

        .text-tool textarea {
            flex: 1;
            width: 100%;
            height: auto;
            min-height: 150px;
            padding: 16px;
            font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace;
            font-size: 15px;
            color: var(--ink-strong);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            box-shadow: inset 0 2px 12px var(--inset-highlight);
            margin-bottom: 0;
            /* ai coding: 文字传送输入框改为不可调整大小 2026/09/18: 21:15 */
            resize: none;
            tab-size: 4;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .text-tool textarea:focus {
            background: var(--surface-strong);
            border-color: var(--accent-soft);
            box-shadow: inset 0 2px 12px var(--inset-highlight), 0 0 0 4px var(--accent-soft);
        }

        /* ai coding: 窄屏时文字传送区回退为上下布局，两个按钮改为横向 2026/09/18: 20:49 */
        @media (max-width: 560px) {
            .text-tool {
                flex-direction: column;
            }

            .text-tool > div {
                flex: 1 1 auto;
                flex-direction: row;
            }

            .text-tool > div .btn {
                flex: 1;
            }
        }

        /* 推送列表 */
        .pushed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: var(--radius-md);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--inset-highlight);
        }

        .pushed-item:last-child {
            margin-bottom: 0;
        }

        .pushed-item-content {
            display: block;
            flex: 1;
            min-width: 0;
            padding: 12px;
            font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink-soft);
            background: var(--surface-weak);
            border-radius: var(--radius-sm);
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: break-word;
            tab-size: 4;
            max-height: 20vh;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .pushed-item-content::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .pushed-item-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            min-width: fit-content;
        }

        .pushed-item-time {
            font-size: 11px;
            color: var(--ink-soft);
            font-family: "SF Mono", Consolas, Menlo, monospace;
        }

        /* ai coding: 复制/查看/清除等小按钮同样为扁平样式 2026/09/18: 20:56 */
        .show-btn,
        .copy-btn {
            height: 30px;
            padding: 0 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            background: var(--btn-bg);
            border: 1px solid var(--accent-soft);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .show-btn:hover,
        .copy-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        /* 全文展示侧栏 */
        #full-text-overlay {
            position: fixed;
            top: 84px;
            right: -105%;
            width: min(30%, 420px);
            height: 82vh;
            padding: 8px;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-lg);
            background: var(--glass-bg-strong);
            border: 1px solid var(--glass-border);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
            z-index: 2000;
            transition: right 0.45s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        #full-text-overlay.active {
            right: 16px;
        }

        .overlay-header {
            padding: 8px 8px 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overlay-header span {
            font-weight: 700;
            letter-spacing: 2px;
        }

        .overlay-content {
            flex: 1;
            margin: 6px;
            padding: 14px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink-soft);
            tab-size: 4;
            background: var(--surface);
            border-radius: var(--radius-md);
        }

        @media (max-width: 800px) {
            #full-text-overlay {
                width: 88%;
            }
        }

        /* 吐司提示 (Toast) */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            padding: 12px 22px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--toast-fg);
            background: var(--toast-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            backdrop-filter: blur(24px) saturate(180%);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
            opacity: 0;
            transform: translateX(30px) scale(0.95);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        /* 文件列表 */
        #file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #file-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            transition: background 0.2s, transform 0.2s;
        }

        #file-list li:hover {
            background: var(--surface-strong);
            transform: translateY(-1px);
        }

        #file-list li a {
            flex: 1;
            min-width: 0;
            color: var(--ink-strong);
            font-weight: 500;
            text-decoration: none;
            /* 防止长文件名挤压排版 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s;
        }

        #file-list li a:hover {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-color: var(--accent-soft);
        }

        .file-size {
            font-size: 11px;
            color: var(--ink-soft);
            font-family: "SF Mono", Consolas, Menlo, monospace;
            white-space: nowrap;
            min-width: fit-content;
        }

        /* 底部二维码与信息 */
        .footer-tools {
            margin-top: 34px;
            padding-top: 22px;
            border-top: 1px solid var(--glass-border);
        }

        .qrcode-box {
            display: flex;
            align-items: stretch;
            justify-content: flex-end;
            padding: 4px;
        }

        @media (max-width: 600px) {
            .footer-tools {
                display: none !important;
            }
            .ip-list-container {
                margin-right: 0;
            }
        }

        #qrcode {
            display: inline-block;
            padding: 8px;
            border-radius: var(--radius-sm);
            background: var(--qrcode-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        #qrcode img {
            display: block;
            border-radius: 8px;
        }

        /* ai coding: 底部“复制关闭下载拦截设置地址”入口的弱化样式 2026/09/18: 19:57 */
        .download-help {
            text-align: center;
            margin: 0 auto 30px;
            max-width: 820px;
            padding: 0 20px;
        }

        .download-help span {
            font-size: 11px;
            color: var(--ink-soft);
            opacity: 0.6;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s;
        }

        .download-help span:hover {
            opacity: 1;
        }

        /* ai coding: 上传框改为图标与提示词同行横向排列，使提示词垂直居中 2026/09/18: 19:51 */
        .upload-dropbox {
            position: relative;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 150px;
            text-align: center;
            cursor: pointer;
            border: 1.5px dashed var(--hairline-strong);
            border-radius: var(--radius-lg);
            background: var(--surface-weak);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            transition: all 0.22s ease;
        }

        .upload-dropbox:hover {
            border-color: var(--accent-soft);
            background: var(--surface);
            box-shadow: inset 0 0 0 4px var(--surface-weak);
        }

        .upload-dropbox input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-dropbox-icon {
            font-size: 30px;
            color: var(--accent);
            line-height: 1;
            filter: drop-shadow(0 4px 10px var(--accent-soft));
        }

        .upload-dropbox-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--ink-soft);
        }

        /* ai coding: 拖拽上传时的高亮样式与全屏提示层 2026/09/18: 19:39 */
        .upload-dropbox.drag-active {
            background: var(--surface);
            border-color: var(--accent);
            border-style: solid;
            box-shadow: inset 0 0 0 4px var(--accent-soft);
        }

        .upload-dropbox.drag-active .upload-dropbox-icon,
        .upload-dropbox.drag-active .upload-dropbox-text {
            color: var(--accent);
        }

        #drop-overlay {
            position: fixed;
            inset: 16px;
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 36px;
            background: var(--drop-bg);
            border: 2px dashed var(--accent);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            backdrop-filter: blur(22px) saturate(160%);
            box-shadow: inset 0 1px 0 var(--glass-highlight);
            pointer-events: none;
        }

        #drop-overlay.active {
            display: flex;
        }

        #drop-overlay span {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 4px;
        }

        /* 粘贴图片 */
        #pasted-image-area {
            display: none;
        }

        .pasted-image-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .pasted-image-header h3 {
            margin: 0;
        }

        .pasted-image-hint {
            color: var(--ink-soft);
            font-size: 12px;
        }

        #pasted-image-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }

        .pasted-image-item {
            position: relative;
            min-height: 120px;
            overflow: hidden;
            border-radius: var(--radius-md);
            background: var(--surface);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 1px 0 var(--inset-highlight);
        }

    <script>
        // ai coding: 增加上传过程中的实时速率与完成后的总平均速率计算 2026/09/09: 14:28
        // ai coding: 抽出 uploadFiles 以便点击选择与拖拽上传共用同一套上传逻辑 2026/09/18: 19:39
        function uploadFiles(files) {
            const formatTransferSpeed = (bytesPerSecond) => {
                const units = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
                let unitIndex = 0;
                let displaySpeed = bytesPerSecond;
                while (displaySpeed >= 1024 && unitIndex < units.length - 1) {
                    displaySpeed /= 1024;
                    unitIndex += 1;
                }
                return `${displaySpeed.toFixed(2)} ${units[unitIndex]}`;
            };

            const updateProgress = (event, uploadStartTime) => {
                const progressBar = document.getElementById('upload-progress-bar');
                const uploadSpeedElement = document.getElementById('upload-speed');

                if (event.lengthComputable) {
                    progressBar.style.width = `${(event.loaded / event.total) * 100}%`;
                }

                const elapsedSeconds = (Date.now() - uploadStartTime) / 1000;
                if (event.loaded > 0 && elapsedSeconds > 0) {
                    uploadSpeedElement.innerText = `当前速率: ${formatTransferSpeed(event.loaded / elapsedSeconds)}`;
                }
            };

            if (files.length > 0) {
                const formData = new FormData();
                for (const file of files) {
                    formData.append('files', file);
                }
                const uploadProgressBar = document.getElementById('upload-progress-bar');
                const uploadSpeedElement = document.getElementById('upload-speed');
                const uploadStartTime = Date.now();
                const totalBytes = Array.from(files).reduce((sum, file) => sum + file.size, 0);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/upload', true);

                xhr.upload.onprogress = (event) => {
                    if (event.lengthComputable) {
                        updateProgress(event, uploadStartTime);
                    }
                };

                xhr.onload = () => {
                    let data;
                    try {
                        data = JSON.parse(xhr.responseText);
                    } catch (error) {
                        data = { success: false, error: '服务器返回无效响应' };
                    }

                    if (data.success) {
                        const elapsedSeconds = (Date.now() - uploadStartTime) / 1000;
                        const averageSpeed = elapsedSeconds > 0 ? totalBytes / elapsedSeconds : totalBytes;
                        uploadSpeedElement.innerText = `平均速率: ${formatTransferSpeed(averageSpeed)}`;
                        uploadProgressBar.style.width = '100%';
                        listFiles(); // 刷新文件列表
                        showToast('文件上传成功！');
                    } else {
                        uploadSpeedElement.innerText = '传输速率: 0 B/s';
                        showToast('上传失败: ' + data.error);
                    }

                    // 重置进度条
                    setTimeout(() => {
                        uploadProgressBar.style.width = '0%';
                    }, 1000);
                };

                xhr.onerror = () => {
                    uploadSpeedElement.innerText = '传输速率: 0 B/s';
                    showToast('上传失败：网络连接错误');
                    uploadProgressBar.style.width = '0%';
                };

                xhr.send(formData);
            }
        }

        // ai coding: 点击文件输入框时继续复用 uploadFiles 2026/09/18: 19:39
        function uploadFile() {
            const input = document.getElementById('file-input');
            uploadFiles(input.files);
        }
    </script>

<script>
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    async function listFiles() {
        const response = await fetch('/list_files');
        const files = await response.json();
        const fileList = document.getElementById('file-list');

        fileList.innerHTML = '';

        files.forEach(file => {
            const listItem = document.createElement('li');
            
            const link = document.createElement('a');
            link.href = `/download/${file.name}`;
            link.innerText = file.name;
            link.setAttribute('download', file.name);

            const sizeSpan = document.createElement('span');
            sizeSpan.className = 'file-size';
            sizeSpan.innerText = formatFileSize(file.size);

            listItem.appendChild(link);
            listItem.appendChild(sizeSpan);
            fileList.appendChild(listItem);
        });
    }

    async function fetchPastedImages() {
        try {
            const response = await fetch('/images');
            if (!response.ok) throw new Error('获取图片失败');
            renderPastedImages(await response.json());
        } catch (error) {
            console.error('Error fetching pasted images:', error);
        }
    }

    function renderPastedImages(images) {
        const area = document.getElementById('pasted-image-area');
        const list = document.getElementById('pasted-image-list');
        list.innerHTML = '';

        if (!images || images.length === 0) {
            area.style.display = 'none';
            return;
        }

        area.style.display = 'block';
        images.forEach(image => {
            const item = document.createElement('div');
            item.className = 'pasted-image-item';

            const link = document.createElement('a');
            link.href = image.url;
            link.target = '_blank';
            link.rel = 'noopener';

            const img = document.createElement('img');
            img.src = image.url;
            img.alt = '粘贴的图片';
            img.loading = 'lazy';
            link.appendChild(img);

            const deleteButton = document.createElement('button');
            deleteButton.className = 'pasted-image-delete';
            deleteButton.type = 'button';
            deleteButton.title = '删除图片';
            deleteButton.setAttribute('aria-label', '删除图片');
            deleteButton.innerText = '×';
            deleteButton.onclick = () => deletePastedImage(image.id, deleteButton);

            item.appendChild(link);
            item.appendChild(deleteButton);
            list.appendChild(item);
        });
    }

    async function deletePastedImage(imageId, button) {
        button.disabled = true;
        try {
            const response = await fetch(`/images/${encodeURIComponent(imageId)}`, {
                method: 'DELETE'
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || '删除失败');
            }
            showToast('图片已删除');
            fetchPastedImages();
        } catch (error) {
            button.disabled = false;
            showToast(error.message || '删除失败');
        }
    }

    async function uploadPastedImages(files) {
        const formData = new FormData();
        files.forEach(file => formData.append('images', file, file.name || 'pasted-image'));

        try {
            showToast('正在上传粘贴的图片...');
            const response = await fetch('/images', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                throw new Error(data.error || '图片上传失败');
            }
            showToast(`已粘贴 ${data.images.length} 张图片`);
            fetchPastedImages();

    let qrcodeInstance = null;

    const showToast = (msg) => {
        const container = document.getElementById('toast-container');

        container.appendChild(toast);

    const processSaveTextBtn = () => {
        const saveTextButton = document.getElementById('save-text-button');
        saveTextButton.addEventListener('click', async () => {
            const textInput = document.getElementById('text-input');
            let text = textInput.value;
            if (!text.trim()) {
                showToast('请先输入文字');
                return;
            }

            // 检查是否为 JSON 并格式化
            try {
                const trimmed = text.trim();
                if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
                    const jsonObj = JSON.parse(trimmed);
                    text = JSON.stringify(jsonObj, null, 4);

            } catch (e) {}

            try {
                const response = await fetch('/save_text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();

    const copyToClipboard = (text, btn) => {
        const performCopy = () => {
            showToast('已复制到剪切板');
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(performCopy).catch(err => {
                fallbackCopy(text, performCopy);
            });
        } else {
            fallbackCopy(text, performCopy);
        }
    }

    const fallbackCopy = (text, callback) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        
        // 确保 textarea 在屏幕外且不可见
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        
        textArea.focus();
        textArea.select();
        
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                callback();
            } else {
                console.error('fallbackCopy 失败');
            }
        } catch (err) {
            console.error('fallbackCopy 抛出异常: ', err);
        }
        
        document.body.removeChild(textArea);

    // ai coding: 识别当前浏览器并返回关闭/管理不安全下载提示的设置地址 2026/09/18: 19:57

        if (/OPR\//.test(ua)) return { browser: 'Opera', url: 'opera://settings/privacy' };
        if (/Firefox\//.test(ua)) return { browser: 'Firefox', url: 'about:preferences#privacy' };
        if (/Chrome\//.test(ua)) return { browser: 'Chrome', url: 'chrome://settings/security' };
        return { browser: '', url: 'chrome://settings/security' };
    };

                timeSpan.className = 'pushed-item-time';
                timeSpan.innerText = item.timestamp;
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = '复制';
                copyBtn.onclick = () => copyToClipboard(displayPath, copyBtn);
                
                metaDiv.appendChild(timeSpan);
                metaDiv.appendChild(copyBtn);
                
                div.appendChild(contentDiv);
                div.appendChild(metaDiv);
                listContainer.appendChild(div);

                // 在添加到 DOM 后检测是否溢出
                setTimeout(() => {
                    if (contentDiv.scrollHeight > contentDiv.clientHeight) {
                        const showBtn = document.createElement('button');
                        showBtn.className = 'show-btn';
                        showBtn.innerText = '查看';
                        showBtn.onclick = () => showFullText(displayPath);
                        metaDiv.appendChild(showBtn);
                    }
                }, 0);
            });
        } else {
            area.style.display = 'none';
        }
    }

    const processPushTextBtn = () => {
        const pushTextButton = document.getElementById('push-text-button');
        pushTextButton.addEventListener('click', async () => {
            const textInput = document.getElementById('text-input');
            let text = textInput.value;
            if (!text.trim()) {
                showToast('请先输入文字');
                return;
            }

            // 检查是否为 JSON 并格式化
            try {
                const trimmed = text.trim();
                if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
                    const jsonObj = JSON.parse(trimmed);
                    text = JSON.stringify(jsonObj, null, 4);
                }
            } catch (e) {}

            try {
                const response = await fetch('/push_text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                if (data.success) {
                    textInput.value = ''; // 清空输入框
                    fetchPushedText(); // 立即更新
                    showToast('推送成功！');
                } else {
                    showToast('推送失败: ' + data.error);
                }
            } catch (error) {
                console.error('Error while pushing text:', error);
                showToast('服务器连接失败');
            }
        });
    }

    async function fetchPushedText() {
        try {
            const response = await fetch('/get_pushed_text');
            const data = await response.json();
            renderPushedList(data);
        } catch (error) {
            console.error('Error fetching pushed text:', error);
        }
    }

    // 当页面加载时，显示文件列表
    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', uploadFile);

        // ai coding: 绑定底部“复制关闭下载拦截设置地址”入口的点击事件 2026/09/18: 19:57
        const downloadHelpLink = document.getElementById('download-help-link');
        downloadHelpLink.addEventListener('click', copyDownloadSettingsUrl);

        // ai coding: 支持将文件拖拽到页面任意位置进行上传 2026/09/18: 19:39
        const uploadZone = document.getElementById('upload-dropbox');
        const dropOverlay = document.getElementById('drop-overlay');
        // dragenter/dragleave 会在子元素间反复触发，用计数避免高亮闪烁。
        let dragDepth = 0;

        const isFileDrag = (event) => Array.from(event.dataTransfer?.types || []).includes('Files');

        document.addEventListener('dragover', (event) => {
            if (!isFileDrag(event)) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
        });

        document.addEventListener('dragenter', (event) => {
            if (!isFileDrag(event)) return;
            event.preventDefault();
            dragDepth += 1;
            uploadZone.classList.add('drag-active');
            dropOverlay.classList.add('active');
        });

        document.addEventListener('dragleave', (event) => {
            if (!isFileDrag(event)) return;
            dragDepth = Math.max(0, dragDepth - 1);
            if (dragDepth === 0) {
                uploadZone.classList.remove('drag-active');
                dropOverlay.classList.remove('active');
            }
        });

        document.addEventListener('drop', (event) => {
            if (!isFileDrag(event)) return;
            event.preventDefault();
            dragDepth = 0;
            uploadZone.classList.remove('drag-active');
            dropOverlay.classList.remove('active');
            const files = event.dataTransfer?.files;
            if (files && files.length > 0) {
                uploadFiles(files);
            }
        });

        // 允许在文本框中输入 Tab 键
        const textInput = document.getElementById('text-input');
        textInput.addEventListener('paste', function(e) {
            const imageFiles = Array.from(e.clipboardData?.items || [])
                .filter(item => item.kind === 'file' && item.type.startsWith('image/'))
                .map(item => item.getAsFile())
                .filter(Boolean);

            if (imageFiles.length > 0) {
                e.preventDefault();
                uploadPastedImages(imageFiles);
            }
        });
        textInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "\t" + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
            }
        });

        generatorQrCode();
        fetchIps(); // 获取 IP 列表
        processDelBtn();
        processClearPushedBtn();
        processSaveTextBtn();
        processPushTextBtn();
        listFiles();
        fetchPastedImages();
        fetchPushedText();

        // 使用 Socket.IO 实现主动刷新
        const socket = io();
        socket.on('refresh_pushed_text', (data) => {
            console.log('Received push update:', data);
            renderPushedList(data);
        });

        socket.on('refresh_files', () => {
            console.log('Received files update');
            listFiles();
        });

        socket.on('refresh_images', () => {
            console.log('Received pasted image update');
            fetchPastedImages();
        });
    });

    // ai coding: 黑白皮肤切换逻辑，写入 localStorage 以便下次访问沿用 2026/09/18: 20:56
    (function () {
        const root = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-toggle-icon');

        const syncIcon = () => {
            const isDark = root.getAttribute('data-theme') !== 'light';
            icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
            toggle.title = isDark ? '切换到亮色皮肤' : '切换到暗色皮肤';
        };

        toggle.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('lct-theme', next);
            syncIcon();
        });

        syncIcon();
    })();
</script>
